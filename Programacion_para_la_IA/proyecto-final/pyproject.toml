[project]
name = "proyecto-final"
version = "0.1.0"
description = "HTTP MCP server for semantic search and analysis of Amazon Electronics products"
readme = "README.md"
authors = [
    { name = "Raul Perez", email = "raul.perez.lopez.1903@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
    "numpy>=2.5.4",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[project.scripts]
proyecto-final = "proyecto_final:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pandas>=3.0.6",
]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
follow_imports = "skip"
